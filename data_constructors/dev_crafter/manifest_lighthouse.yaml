.constants:
  - &base_style "Style: Early 20th (1920s) Century American Lighthouse. Granite structure, late victorian style, early 20th century."
  - &writing_style_prompt >
      To describe and write the following data structures, use creative, atmospheric, and clear language. When describing interactions always use second-person present tense.
  - &items_base_prompt >
      THEME = "Early 20th century American lighthouse" 
      Describe the following item by quietly characterizing it through the lens of the THEME above. 
      
      CRITICAL CONSTRAINT: You must NEVER use the exact words of the THEME (or its direct synonyms) in your description. Instead, translate the THEME into specific textures, materials, lighting, and environmental wear. Focus on the *feeling* the object evokes rather than just stating its purpose.


config:
  provider: "openrouter"
  model: "qwen/qwen3.7-flash"
  export_dir: "inventory_items/items_provider/items_data/lighthouse_revival"

