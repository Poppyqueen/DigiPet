.constants:
  - &coastal_style "Style: A coastal biome, small rural town environment. Hiking area."
  - &indoors_item "Cozy room interior item"
  - &victorian_prompt >
      Style Guide: Focus on 'Industrial Opulence.' Use materials like polished 
      brass, wrought iron, etched glass, and dark hardwoods. Describe ornate 
      engravings, filigree, and mechanical details (valves, pumps, hand-cranks). 
      Show age through 'tarnished' or 'hand-polished' surfaces. Avoid the 
      word 'Victorian'.

config:
  provider: "openrouter"
  model: "google/gemma-4-26b-a4b-it"
  export_dir: "data_constructors/dev_crafter/items"

tasks:

  - mode: "item"
    types: ["maze_interface"]
    context: 
      - *coastal_style
    prompts:
      - "A magical embedded rock in the sand, it seems to be powered by the energy of the distant waves, it flickers following the natural pattern of the sea, when you interact with it it displays glyphs and symbols that invite interaction."

