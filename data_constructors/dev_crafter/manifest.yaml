.constants:
  - &coastal_style "Style: A coastal biome, small rural town environment. Hiking area."
  - &indoors_item "Cozy room interior item"
  - &writing_style_prompt >
      To describe and write the following data structures use a creative yet clear language, always use second person present tense.
  - &rooms_base_prompt >
      The following area should be quietly characterized by its 'cozy architecture'.

config:
  provider: "openai"
  model: "gpt-5.4-mini"
  export_dir: "inventory_items/rooms_provider/rooms_data/normal_house"

tasks:

  - mode: "room"
    types: ["outdoors_area", "open_soil_zone"]
    context: 
      - *writing_style_prompt
      - *rooms_base_prompt
    prompts:
      - "Name: garden"

  - mode: "room"
    types: []
    context:
      - *writing_style_prompt
      - *rooms_base_prompt
    prompts:
      - "Name: kitchen "
      - "Name: bedroom "
      - "Name: bathroom "
      - "Name: living room "