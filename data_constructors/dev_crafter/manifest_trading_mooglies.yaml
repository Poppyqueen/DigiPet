.constants:
  - &mooglies_prompt "A 'Moogly' is a spirit entity that manifests as a small, short fur animal creature shaped like an apple, the size of a large grapefruit, with only two feet as extremities, it being a ball shaped creature, it bobs and jumps around and has a shrill vocalization of abstract sounds. Their fur is characterized by its diverse patterns and colors that they hold. These mooglies here are trading spirits, trading with wanderers or anyone that is willing."
  - &writing_style_prompt >
      To describe and write the following data structures, use creative, atmospheric, and clear language.
  - &items_base_prompt >
      THEME = "absurdism soft fantasy" 
      Describe the following item by quietly characterizing it through the lens of the THEME above. 
      
      CRITICAL CONSTRAINT: You must NEVER use the exact words of the THEME (or its direct synonyms) in your description. Instead, translate the THEME into specific textures, materials, lighting, and environmental wear. Focus on the *feeling* the object evokes rather than just stating its purpose.


config:
  provider: "openrouter"
  model: "~deepseek/deepseek-v4-flash-latest"
  export_dir: "inventory_items/items_provider/items_data/mooglies"

tasks:

  - mode: "item"
    types: ["store_endpoint"]
    context:
      - *mooglies_prompt
      - *writing_style_prompt
      - *items_base_prompt
    prompts:
      - "Diamon patterned Moogly, red and white, this moogly is a furniture and electronics trader. They look a bit absentminded"
      - "Polka dots pale blue Moogly, white backdrop, this moogly is a drinks and plant_based_foods trader. Tending to go on incomprehensible rambles."
      - "Star stamped black and white fur Moogly, this moogly trades staples, condiments and snacks. This Moogly has a fiery and forward personality." 
      - "Checkered yellow and white stripes Moogly, this moogly trades hearty_meals and cookware&tableware. They seem to be incredibly focused on trading."
      - "Damascus patterned black and purple Moogly, this moogly trades seeds and harvest. A whistling, swaying Moogly."
