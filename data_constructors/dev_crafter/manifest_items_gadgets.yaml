.constants:
  - &coastal_style "Style: A coastal biome, small rural town environment. Hiking area."
  - &writing_style_prompt >
      To describe and write the following data structures, use creative, atmospheric, and clear language. For the 'effects' key use second-person present tense.
  - &items_base_prompt >
      THEME = "cozy 21th century contemporary" 
      Describe the following item by quietly characterizing it through the lens of the THEME above. 
      
      CRITICAL CONSTRAINT: You must NEVER use the exact words of the THEME (or its direct synonyms) in your description. Instead, translate the THEME into specific textures, materials, lighting, and environmental wear. Focus on the *feeling* the object evokes.


config:
  provider: "openai"
  model: "gpt-5.4-mini"
  export_dir: "inventory_items/items_provider/items_data/gadgets"
