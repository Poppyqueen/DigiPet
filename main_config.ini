
[AI_DeepMemory]
; This is for the LLM used by the deep memory process
deep_memory_ai_provider=openai
deep_memory_ai=gpt-4.1-mini

; This is for the embeddings provider
deep_memory_embeddings_provider=ollama
;       gemini, openai, ollama (no groq embeddings)
; No setting for the embeddings model name, it will be a default model for each
; if we wanted to make it configurable, we would need to save the setting selection
; for each model, and override the ini config if there was a model already selected before
; do not change the embeddings provider if you have already ran your agent at all. 

[AI]

; Change this
; make sure to select the correct provider for your selected model either memory or general
; from the options:
;       gemini, openai, groq, ollama

general_ai_provider=openai
memory_ai_provider=openai
cook_provider=openai


; Change this
; Folder for the individual pet state and memory, each pet has its own folder created inise the ´bots´ folder.
; Can be understood as the 'name' of the pet, however, the agent doesn't recieve this name in the context or any messages.
pets_folder=heaven_bot_3


; Change this
; This model is used for general interactions, conversations, and decision-making.
general_model=gpt-4.1-mini
; gemini-2.0-flash-lite
; qwen3:4b-q4_K_M
; qwen-qwq-32b
; llama-3.3-70b-versatile
; llama-3.1-8b-instant
; gemini-2.5-flash-preview-04-17
; gemini-2.0-flash-lite
; gpt-4.1-mini
; This model is used for general interactions, conversations, and decision-making.


; Change this
memory_model=gpt-4.1-mini
;gpt-4.1-mini
; This model is used for the memory system, it will be used to analyze and summarize the pet's memory and past actions.
; The memory system needs to be updated into an ABC method


; Change this
cook_model=gpt-4.1-mini
; This model is used for the cooking tool, it will create items from the given ingredients.


