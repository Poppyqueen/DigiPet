[Tools]

; These are optional tools that can be enabled or disabled based on the user's preferences, they use external APIs and services.
enable_youtube = True
; Enabling youtube will allow the bot to create and manage playlists on the user's YouTube account. 
; Important, it will initialize an OAuth2 flow to authenticate the user when first running the bot.
; Needs detailed setup within your Google Developer Console, including setting up OAuth2 credentials, enabling the YouTube Data API v3. (Detailed explanation in utils/youtube_service.py)

enable_discogs = True
; Will connect to the user's Discogs account, allowing the bot to access the user's collection and wantlist.
; Needs DISCOGS_AGENT_NAME and DISCOGS_USER_TOKEN in the .env file, does not require OAuth2 authentication.

enable_musicbrainz = False
; Will allow the bot to search for artists and their discography using the MusicBrainz API. It does not access the user's account.
; No auth, API key nor user credentials needed but requires a MUSICBRAINZ_APP_NAME and MUSICBRAINZ_APP_VERSION to be set in the environment variables.

enable_bluesky = False
; Will allow the bot to post and interact with Bluesky, a decentralized social network.
; Needs user login credentials in the environment variables. No API key is needed.

[game_settings]
initial_state = base_state

; base_state or dev_room are the available initial states for the game.
; This is used only on the very first initialization of the agent, subsequent runs will not use this setting.